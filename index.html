<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neko Tip Calculator</title>
    
    <link rel="icon" type="image/png" href="HREF_TO_YOUR_CAT_ICON">
    <link rel="apple-touch-icon" href="HREF_TO_YOUR_CAT_ICON">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --gb-gray: #9ca0a8;
            --gb-dark-gray: #7a7d83;
            --gb-screen: #8bac0f;
            --gb-dark: #0f380f;
            --gb-red: #a22633;
            --gb-blue: #2d318b;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Handheld Body */
        .gameboy {
            background: var(--gb-gray);
            width: 320px;
            height: 520px;
            border-radius: 10px 10px 60px 10px;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.1), 15px 15px 0px #111;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Screen Surround */
        .screen-container {
            background: #3d3d3d;
            width: 280px;
            height: 240px;
            border-radius: 10px 10px 45px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            border: 2px solid #222;
        }

        /* The "LCD" */
        .screen {
            background: var(--gb-screen);
            width: 80%;
            height: 80%;
            padding: 15px;
            color: var(--gb-dark);
            display: flex;
            flex-direction: column;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.2);
        }

        .title { 
            font-size: 14px; 
            margin: 0 0 10px 0; 
            text-align: center; 
            border-bottom: 2px solid var(--gb-dark);
            letter-spacing: 1px;
        }

        .display {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            min-height: 45px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input {
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--gb-dark);
            color: var(--gb-dark);
            width: 90%;
            padding: 4px;
            font-family: inherit;
            font-weight: bold;
            outline: none;
        }

        /* Controls */
        .controls {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding: 0 10px;
        }

        /* D-Pad Placeholder */
        .d-pad {
            width: 80px;
            height: 80px;
            background: #333;
            position: relative;
            clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-25deg);
        }

        .btn-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 2px 4px 0px #555;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.5);
            font-weight: bold;
        }

        .btn-a { background: var(--gb-red); }
        .btn-b { background: var(--gb-red); }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .label {
            margin-top: 8px;
            font-size: 10px;
            color: var(--gb-blue);
            font-weight: bold;
            transform: rotate(25deg);
        }

        /* Bottom Buttons */
        .start-select {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            transform: rotate(-25deg);
        }

        .small-btn {
            width: 40px;
            height: 10px;
            background: #777;
            border-radius: 10px;
            box-shadow: 2px 2px 0px #555;
        }
    </style>
</head>
<body>

    <div class="gameboy">
        <div class="screen-container">
            <div class="screen">
                <div class="title">NEKO-CALC v1.0</div>
                <div class="display" id="output">ENTER BILL_</div>
                <div class="inputs">
                    <input type="number" id="bill" placeholder="TOTAL $">
                    <input type="number" id="tip" placeholder="TIP %">
                    <input type="number" id="people" placeholder="PEOPLE">
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="d-pad"></div>
            <div class="action-buttons">
                <div class="btn-wrap">
                    <button class="btn btn-b" onclick="reset()">B</button>
                    <span class="label">RESET</span>
                </div>
                <div class="btn-wrap">
                    <button class="btn btn-a" onclick="calculate()">A</button>
                    <span class="label">CALC</span>
                </div>
            </div>
        </div>

        <div class="start-select">
            <div class="small-btn"></div>
            <div class="small-btn"></div>
        </div>
    </div>

    <script>
        function calculate() {
            const bill = parseFloat(document.getElementById('bill').value);
            const tip = parseInt(document.getElementById('tip').value);
            const people = parseInt(document.getElementById('people').value);

            // Validation logic
            if (isNaN(bill) || isNaN(tip) || isNaN(people) || people <= 0) {
                document.getElementById('output').innerText = "INPUT ERROR";
                return;
            }

            // Calculation logic
            const tipToPercent = tip / 100;
            const totalTip = bill * tipToPercent;
            const totalBill = bill + totalTip;
            const billPerPerson = totalBill / people;
            const finalAmount = billPerPerson.toFixed(2);

            // UI Update
            document.getElementById('output').innerText = `EACH PAY:\n$${finalAmount}`;
        }

        function reset() {
            document.getElementById('bill').value = '';
            document.getElementById('tip').value = '';
            document.getElementById('people').value = '';
            document.getElementById('output').innerText = 'ENTER BILL_';
        }
    </script>
</body>
</html>
