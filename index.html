<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neko Tip Calc</title>
    
    <link rel="icon" type="image/png" href="faivcon.png">
    <link rel="apple-touch-icon" href="faivcon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --gb-screen: #8bac0f;
            --gb-dark: #0f380f;
            --gb-red: #a22633;
            --pc-bg: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%;
            height: 100svh; 
            background-color: var(--pc-bg);
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; overflow: hidden;
        }

        .console-unit {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .pc-header {
            display: none; text-align: center; font-weight: 900; color: var(--gb-dark);
            border-bottom: 2px solid var(--gb-dark); padding-bottom: 5px;
            margin-bottom: 8px; letter-spacing: 2px;
        }

        .viewport {
            background-color: var(--gb-screen);
            padding: 10px 20px; color: var(--gb-dark);
            flex: 1; 
            display: flex; flex-direction: column; box-sizing: border-box;
            overflow: hidden;
        }

        .result-area {
            text-align: center; margin-bottom: 12px; 
            height: 175px; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
            border: 4px dashed var(--gb-dark); background: rgba(0,0,0,0.05);
            padding: 5px; box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1; font-size: 1.1rem; overflow: hidden;
        }

        .cat-container { 
            white-space: pre; 
            display: block; 
            margin: 0 auto; 
            padding: 0;
            font-size: 2.1rem;   /* The "Chonky" factor */
            line-height: 0.85;   /* Keeps the ears and face from drifting apart */
        }
        .res-row { width: 100%; white-space: normal; line-height: 1.1; }
        .res-label { font-size: 0.7rem; font-weight: 900; opacity: 0.8; text-transform: uppercase; display: block; }
        .res-value { font-size: 1.6rem; font-weight: 900; }
        
        .divider { width: 70%; height: 2px; background-color: var(--gb-dark); margin: 2px auto; opacity: 0.4; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-row label { font-weight: 900; font-size: 0.8rem; margin-bottom: 2px; display: block; }

        input {
            background: rgba(0,0,0,0.05); border: 3px solid var(--gb-dark);
            color: var(--gb-dark); padding: 12px 10px; font-family: inherit;
            font-size: 1.5rem; font-weight: 900; width: 100%; box-sizing: border-box; outline: none;
            border-radius: 0; appearance: none;
        }

        /* --- UNIFIED PLACEHOLDER FIX --- */
        input::placeholder {
            color: var(--gb-dark);
            opacity: 0.4; /* Ensures it looks the same on all iPhones */
        }

        @media (min-width: 450px) {
            .console-unit { width: 840px; border-left: 4px solid #333; border-right: 4px solid #333; }
            .pc-header { display: block; font-size: 1.8rem; }
            .result-area { height: 260px; font-size: 2.5rem; }
            .res-value { font-size: 2.2rem; }
            .res-label { font-size: 1rem; }
            input { padding: 18px 15px; font-size: 2rem; }
        }

        .controls { 
            background: #333; 
            padding: 15px 20px 20px 20px; 
            display: flex; gap: 15px; 
        }

        /* --- UPDATED BUTTON STYLE --- */
        .btn {
            flex: 1; 
            height: 55px; /* Shorter buttons to save space */
            border-radius: 8px; border: none;
            font-family: inherit; font-size: 1.2rem; font-weight: 900; color: white;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-b { background: #555; border-bottom: 4px solid #222; }
        .btn-a { background: var(--gb-red); border-bottom: 4px solid #6d1822; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .footer-tag { text-align: center; font-size: 0.65rem; margin-top: auto; font-weight: 900; opacity: 0.6; padding-top: 5px; }
    </style>
</head>
<body>

    <div class="console-unit">
        <div class="viewport">
            <div class="pc-header">NEKO CALC v4.9.7</div>

            <div id="output" class="result-area">
                <span class="cat-container"> /\_/\ 
( o.o )
 > ^ < </span>
            </div>

            <div class="input-group">
                <div class="input-row"><label>BILL $</label><input type="number" id="bill" placeholder="0.00" inputmode="decimal"></div>
                <div class="input-row"><label>TIP %</label><input type="number" id="tip" placeholder="15" inputmode="numeric"></div>
                <div class="input-row"><label>PEOPLE</label><input type="number" id="people" placeholder="1" inputmode="numeric"></div>
            </div>
            
            <div class="footer-tag">🐾 NEKO SOFT SYSTEMS 2026</div>
        </div>

        <div class="controls">
            <button class="btn btn-b" onclick="reset()">RESET</button>
            <button class="btn btn-a" onclick="calculate()">CALC</button>
        </div>
    </div>

    <script>
        const faceOpen = " /\\_/\\ \n( o.o )\n > ^ < ";
        const faceBlink = " /\\_/\\ \n( -.- )\n > ^ < "; 
        let isCalculating = false;

        function doBlink() {
            if (isCalculating) return;
            const catContainer = document.querySelector('.cat-container');
            if (catContainer) {
                catContainer.textContent = faceBlink;
                setTimeout(() => { if (!isCalculating) catContainer.textContent = faceOpen; }, 400); 
            }
        }

        setInterval(() => { if (Math.random() > 0.5) doBlink(); }, 2500);

        function calculate() {
            const bill = parseFloat(document.getElementById('bill').value);
            const tipPercent = parseFloat(document.getElementById('tip').value);
            const people = parseInt(document.getElementById('people').value);

            if (isNaN(bill) || isNaN(tipPercent) || isNaN(people) || people <= 0) {
                document.getElementById('output').innerHTML = '<span class="res-value">INPUT ERROR</span>';
                return;
            }

            isCalculating = true; 
            const tipTotal = bill * (tipPercent / 100);
            const billTotal = bill + tipTotal;
            const eachPay = billTotal / people;
            
            const output = document.getElementById('output');
            output.innerHTML = `
                <div class="res-row">
                    <span class="res-label">Total</span>
                    <span class="res-value">$${billTotal.toFixed(2)}</span>
                </div>
                <div class="divider"></div>
                <div class="res-row">
                    <span class="res-label">Tip Amount</span>
                    <span class="res-value">$${tipTotal.toFixed(2)}</span>
                </div>
                <div class="divider"></div>
                <div class="res-row">
                    <span class="res-label">Each Pays</span>
                    <span class="res-value">$${eachPay.toFixed(2)}</span>
                </div>
            `;
            document.activeElement.blur(); 
        }

        function reset() {
            isCalculating = false; 
            document.getElementById('bill').value = '';
            document.getElementById('tip').value = '';
            document.getElementById('people').value = '';
            const output = document.getElementById('output');
            output.innerHTML = `<span class="cat-container">${faceOpen}</span>`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            ['bill', 'tip', 'people'].forEach(id => {
                document.getElementById(id).addEventListener("keypress", (e) => {
                    if (e.key === "Enter") calculate();
                });
            });
        });
    </script>
</body>
</html>
