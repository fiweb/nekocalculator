<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neko Tip Calc</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --gb-screen: #8bac0f;
            --gb-dark: #0f380f;
            --gb-red: #a22633;
            --pc-bg: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100svh; 
            background-color: var(--pc-bg);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center; 
            overflow: hidden;
            touch-action: manipulation;
        }

        .console-unit {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- MOBILE DEFAULTS (Tighter) --- */
        .viewport {
            background-color: var(--gb-screen);
            padding: 20px 25px; /* Tighter for mobile */
            color: var(--gb-dark);
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--gb-dark);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 { margin:0; letter-spacing: 2px; font-size: 1.5rem; }

        .result-area {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
            height: 130px; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            border: 3px dashed var(--gb-dark);
            background: rgba(0,0,0,0.05);
            line-height: 1.2;
            white-space: pre; 
            overflow: hidden;
        }

        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input {
            background: transparent;
            border: 3px solid var(--gb-dark);
            color: var(--gb-dark);
            padding: 10px;
            font-family: inherit;
            font-size: 16px; 
            font-weight: bold;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            border-radius: 0;
        }

        /* --- PC / TABLET OVERRIDES (Roomy) --- */
        @media (min-width: 450px) {
            .console-unit { 
                width: 840px; 
                border-left: 4px solid #333;
                border-right: 4px solid #333;
                box-shadow: 0 0 50px rgba(0,0,0,0.8);
            }
            .viewport { padding: 40px; } /* Roomy original padding */
            .header { margin-bottom: 30px; padding-bottom: 15px; }
            .header h1 { font-size: 2rem; letter-spacing: 4px; }
            .result-area { height: 160px; margin-bottom: 35px; }
            .input-group { gap: 20px; }
            input { padding: 15px; font-size: 1.4rem; }
        }

        /* --- CONTROLS --- */
        .controls {
            background: #333;
            padding: 20px 25px;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
            width: 100%;
        }

        .btn {
            flex: 1;
            height: 75px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-b { background: #555; border-bottom: 5px solid #222; }
        .btn-a { background: var(--gb-red); border-bottom: 5px solid #6d1822; }
        .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn span { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }

        .footer-tag {
            text-align: center;
            font-size: 0.8rem;
            margin-top: auto;
            padding-top: 15px;
            font-weight: bold;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="console-unit">
        <div class="viewport">
            <div class="header">
                <h1 id="title-text">NEKO CALC v3.7</h1>
            </div>

            <div class="result-area" id="output">
 /\_/\ 
( o.o )
 > ^ < 
            </div>

            <div class="input-group">
                <div class="input-row">
                    <label style="font-weight:bold; font-size:0.8rem;">BILL $</label>
                    <input type="number" id="bill" placeholder="0.00" inputmode="decimal">
                </div>
                <div class="input-row">
                    <label style="font-weight:bold; font-size:0.8rem;">TIP %</label>
                    <input type="number" id="tip" placeholder="15" inputmode="numeric">
                </div>
                <div class="input-row">
                    <label style="font-weight:bold; font-size:0.8rem;">PEOPLE</label>
                    <input type="number" id="people" placeholder="1" inputmode="numeric">
                </div>
            </div>
            
            <div class="footer-tag">🐾 NEKO SOFT SYSTEMS 2026</div>
        </div>

        <div class="controls">
            <button class="btn btn-b" onclick="reset()">
                B <span>RESET</span>
            </button>
            <button class="btn btn-a" onclick="calculate()">
                A <span>CALC</span>
            </button>
        </div>
    </div>

    <script>
        const faceOpen = " /\\_/\\ \n( o.o )\n > ^ < ";
        const faceBlink = " /\\_/\\ \n( -.- )\n > ^ < "; 
        let isCalculating = false;

        function doBlink() {
            if (isCalculating) return;
            const output = document.getElementById('output');
            output.innerText = faceBlink;
            setTimeout(() => {
                if (!isCalculating) output.innerText = faceOpen;
            }, 400); 
        }

        setInterval(() => {
            if (Math.random() > 0.5) doBlink();
        }, 2000);

        function calculate() {
            const bill = parseFloat(document.getElementById('bill').value);
            const tip = parseInt(document.getElementById('tip').value);
            const people = parseInt(document.getElementById('people').value);

            if (isNaN(bill) || isNaN(tip) || isNaN(people) || people <= 0) {
                document.getElementById('output').innerText = "INPUT ERROR";
                return;
            }

            isCalculating = true; 
            const total = (bill + (bill * (tip / 100))) / people;
            document.getElementById('output').style.fontSize = "2.2rem";
            document.getElementById('output').innerHTML = `EACH PAY:<br>$${total.toFixed(2)}`;
            document.activeElement.blur(); 
        }

        function reset() {
            isCalculating = false; 
            document.getElementById('bill').value = '';
            document.getElementById('tip').value = '';
            document.getElementById('people').value = '';
            document.getElementById('output').style.fontSize = "1.6rem";
            document.getElementById('output').innerText = faceOpen;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") calculate();
        }

        document.addEventListener("DOMContentLoaded", () => {
            const inputIds = ['bill', 'tip', 'people'];
            inputIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener("keypress", handleKeyPress);
            });
        });
    </script>
</body>
</html>
